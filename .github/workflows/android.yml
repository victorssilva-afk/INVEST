name: Build Android APK (Crypto.Invest)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }

      - name: Install frontend deps
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build web (thin shell)
        working-directory: frontend
        run: yarn build

      - name: Install Capacitor
        run: |
          npm i -g @capacitor/cli
          cd frontend
          yarn add @capacitor/core @capacitor/android
          npx cap init "Crypto.Invest" pt.invest.cryptoinvest --web-dir build || true
          cp ../capacitor.config.json ./capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Build APK (debug)
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cryptoinvest-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
