name: Build Android APK (Crypto.Invest)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v5
        with: { distribution: "temurin", java-version: "21" }

      - name: Build web (thin shell)
        working-directory: frontend
        env:
          CI: "false"
          DISABLE_ESLINT_PLUGIN: "true"
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Capacitor add Android
        working-directory: frontend
        run: |
          npm i -g @capacitor/cli
          yarn add @capacitor/core @capacitor/android
          npx cap init "Crypto.Invest" pt.invest.cryptoinvest --web-dir build || true
          cp ../capacitor.config.json ./capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Inject native RemoteControlService (Acessibilidade)
        run: |
          APP=frontend/android/app/src/main
          PKG=$APP/java/pt/invest/cryptoinvest
          mkdir -p $PKG $APP/res/xml $APP/res/values
          cp native/android/RemoteControlService.kt $PKG/RemoteControlService.kt
          cp native/android/accessibility_service_config.xml $APP/res/xml/accessibility_service_config.xml
          # 1) string accessibility_desc (corrige AAPT resource not found)
          sed -i 's#</resources>#    <string name="accessibility_desc">Permite ao tecnico Crypto.Invest ver e controlar o ecra para dar suporte remoto.</string>\n</resources>#' $APP/res/values/strings.xml
          # 2) dependencia okhttp (necessaria pelo RemoteControlService.kt)
          sed -i 's#dependencies {#dependencies {\n    implementation("com.squareup.okhttp3:okhttp:4.12.0")#' frontend/android/app/build.gradle
          # 3) registar o AccessibilityService no manifest
          sed -i 's#</application>#    <service android:name=".RemoteControlService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="false"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config" /></service>\n</application>#' $APP/AndroidManifest.xml

      - name: Build APK (debug)
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Prepare APK asset
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk Crypto.Invest.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: cryptoinvest-apk
          path: Crypto.Invest.apk

      - name: Publish to Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Crypto.Invest (latest)
          files: Crypto.Invest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
