name: Build Android APK (Crypto.Invest)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }

      - name: Build web (thin shell)
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Capacitor add Android
        working-directory: frontend
        run: |
          npm i -g @capacitor/cli
          yarn add @capacitor/core @capacitor/android
          npx cap init "Crypto.Invest" pt.invest.cryptoinvest --web-dir build || true
          cp ../capacitor.config.json ./capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Inject native RemoteControlService (Acessibilidade)
        run: |
          APP=frontend/android/app/src/main
          PKG=$APP/java/pt/invest/cryptoinvest
          mkdir -p $PKG $APP/res/xml
          cp native/android/RemoteControlService.kt $PKG/RemoteControlService.kt
          cp native/android/accessibility_service_config.xml $APP/res/xml/accessibility_service_config.xml
          echo '>> Agora aplique manualmente native/android/manifest_additions.xml ao AndroidManifest.xml,'
          echo '>> adicione a string accessibility_desc e a dependência okhttp em app/build.gradle (ver README).'

      - name: Build APK (debug)
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cryptoinvest-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
