name: Build Android APK Nativa (Crypto.Invest)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: "temurin", java-version: "17" }
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK (debug)
        working-directory: android-native
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar asset
        run: cp android-native/app/build/outputs/apk/debug/app-debug.apk Crypto.Invest.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: cryptoinvest-apk
          path: Crypto.Invest.apk

      - name: Publicar na Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Crypto.Invest (latest)
          files: Crypto.Invest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
